# Alembic config - the single entry point for schema changes on persistent databases
# (local MySQL compose / production PostgreSQL).
#
# NOTE: keep this file ASCII-only. Alembic reads it with the *locale* encoding
# (GBK on Chinese Windows), so non-ASCII comments break parsing outright.
# Put Chinese comments in migrations/env.py and the version files instead -
# Python source is always UTF-8.
#
# sqlalchemy.url is intentionally empty: migrations/env.py reads DATABASE_URL only
# and exits if it is missing, so a migration can never silently run against the
# local SQLite file while you believe you migrated production.
#
#   local compose (MySQL):  $env:DATABASE_URL="mysql+pymysql://...@localhost:3306/psi_fin?charset=utf8mb4"; uv run alembic upgrade head
#   production (Neon/PG):   $env:DATABASE_URL="postgresql://..."; uv run alembic upgrade head
#
# Test databases do not use Alembic: tests/conftest.py builds a throwaway SQLite
# file with Base.metadata.create_all.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
