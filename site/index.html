<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WMS 系统设计方案预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .wrap { width: 100%; max-width: 960px; text-align: center; }
    h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
    .sub { margin-top: 12px; font-size: 15px; color: #86868b; }
    .cards {
      margin-top: 48px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    a.card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      padding: 28px;
      min-height: 180px;
      border-radius: 20px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #0071e3, #5ac8fa);
      box-shadow: 0 12px 30px rgba(0, 113, 227, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    a.card.bi {
      background: linear-gradient(135deg, #1d1d1f, #3a3a3c);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }
    a.card:hover { transform: translateY(-4px); }
    .card .tag { font-size: 13px; opacity: 0.85; }
    .card .name { margin-top: 10px; font-size: 20px; font-weight: 600; line-height: 1.4; }
    .card .arrow { margin-top: 20px; font-size: 14px; opacity: 0.9; }
    .footer { margin-top: 40px; font-size: 13px; color: #86868b; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>WMS 仓储管理系统 · 设计方案预览</h1>
    <p class="sub">Apple Store 风格中后台 UI 与 BI 数据看板的静态演示页</p>

    <div class="cards">
      <a class="card bi" href="apple-store-wms.html">
        <div>
          <div class="tag">BI 数据看板</div>
          <div class="name">WMS BI 数据看板<br />Apple Store 风格</div>
        </div>
        <div class="arrow">进入预览 →</div>
      </a>
      <a class="card" href="business-console-plan.html">
        <div>
          <div class="tag">中后台搭建方案</div>
          <div class="name">电商企业业财一体<br />中后台方案 Demo</div>
        </div>
        <div class="arrow">进入预览 →</div>
      </a>
    </div>

    <p class="footer">纯静态页面 · 无需后端即可浏览</p>
  </div>
</body>
</html>
