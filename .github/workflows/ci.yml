name: CI

# 触发：push/PR 到 master（本仓库默认分支为 master）
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ===== 后端：单元测试（pytest，不连真实数据库）=====
  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  # ===== 前端：编译校验 + 单元测试（vitest）=====
  frontend-build:
    name: Frontend build + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - run: npm ci
      - name: Type check & build
        run: npm run build
      - name: Unit tests
        run: npm test

  # ===== 容器化：校验前后端镜像可构建（不推送仓库）=====
  docker-build:
    name: Docker image build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-python
          push: false
          tags: wms-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-vue
          push: false
          tags: wms-frontend:ci
