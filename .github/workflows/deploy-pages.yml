name: Deploy demo site to GitHub Pages

# 触发:push/PR 合并到 master 时构建前端 SPA 并发布整个 site/;也支持手动触发
on:
  push:
    branches: [master]
  workflow_dispatch:

# GitHub Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Install frontend deps
        working-directory: frontend-vue
        run: npm ci

      - name: Build SPA (mock mode, base=/wms/app/)
        working-directory: frontend-vue
        run: npm run build:pages

      - name: Assemble site (SPA → site/app)
        run: |
          rm -rf site/app
          mkdir -p site/app
          cp -r frontend-vue/dist/. site/app/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 站点根:落地页 + 静态演示页 + app/(SPA 构建产物) + .nojekyll
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
